<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : utilise tout l'écran de l'iPhone (encoche comprise) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2e7d32" />
    <!-- Balises propres à iOS : Safari ne lit pas tout le manifest -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nutrition" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Nutrition</title>
  </head>
  <body>
    <main id="vue"></main>
    <!-- Barre d'onglets en bas : atteignable avec le pouce -->
    <nav class="onglets">
      <button data-onglet="ingredients">Ingrédients</button>
      <button data-onglet="profil">Profil</button>
      <button data-onglet="parametres">Paramètres</button>
    </nav>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
